# FreeCAD CI image population: the same keyed, conditional builders as ci.yml.
# Every pipeline can recover evicted images. Cron/manual preserve existing keys;
# refresh external packages via ci/images-refresh.txt and running:
#   sh ci/woodpecker/ci-images-key.sh update
# :24.04 remains a compatibility alias only. Identity is logged by the final gate.
when:
  - event: [manual, cron, tag]
  - event: push
    branch: FreeCAD-start

labels:
  backend: docker

# Non-recursive, shallow clone: the deps build only needs package/ubuntu/ and the
# mcp build only needs tools/mcp/freecad-mcp/ (fetched on demand below). Avoids
# cloning the large submodules (OndselSolver, GSL, AddonManager).
clone:
  - name: clone-shallow
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      tags: true
      depth: 1

# Committed keys, checked against ci.yml and the dependency inputs before builds.
variables:
  - &freecad_ci_deps_image registry-freecad:5000/freecad-ci-deps:24.04-81547b6a5295
  - &freecad_ci_mcp_image registry-freecad:5000/freecad-ci-mcp:24.04-93468f8e9827
  - &freecad_registry_internal_url http://registry-freecad:5000

steps:
  - name: init-mcp-submodule
    image: alpine/git
    depends_on: []
    commands:
      - git config --global --add safe.directory '*'
      - git submodule update --init --depth 1 tools/mcp/freecad-mcp

  - name: ci-images-check
    image: gcr.io/go-containerregistry/crane:debug
    depends_on: [init-mcp-submodule]
    environment:
      FREECAD_CI_REGISTRY: *freecad_registry_internal_url
    commands:
      - sh ci/woodpecker/ci-images-check.sh

  - name: build-deps-image
    image: &freecad_kaniko_image gcr.io/kaniko-project/executor:debug
    pull: true
    depends_on: [ci-images-check]
    environment:
      FREECAD_CI_REGISTRY: *freecad_registry_internal_url
    volumes:
      - /tmp/freecad-ci-publish:/tmp/freecad-ci-publish
    commands:
      - sh ci/woodpecker/ci-images-build.sh deps

  - name: build-mcp-image
    image: *freecad_kaniko_image
    pull: true
    depends_on: [init-mcp-submodule, build-deps-image]
    environment:
      FREECAD_CI_REGISTRY: *freecad_registry_internal_url
    volumes:
      - /tmp/freecad-ci-publish:/tmp/freecad-ci-publish
    commands:
      - sh ci/woodpecker/ci-images-build.sh mcp

  - name: ci-images-ready
    image: alpine:3.20
    depends_on: [build-mcp-image]
    environment:
      FREECAD_CI_REGISTRY: *freecad_registry_internal_url
    commands:
      - sh ci/woodpecker/ci-images-verify.sh
